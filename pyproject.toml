[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
"tests/*" = ["B011"]
# Depends()/Header() in defaults is the FastAPI idiom, not a bugbear violation.
"src/api/*" = ["B008"]
"src/utils/health.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
skip_empty = true
# Measured 2026-09-25: 51% (82 tests). Gate sits a little below to absorb noise.
fail_under = 48
