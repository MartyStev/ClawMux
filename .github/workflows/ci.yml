name: CI

on:
  push:
    branches: [main, master, test_ops]
  pull_request:
    branches: [main, master, test_ops]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
      - name: Run tests
        run: |
          python -m pytest -q
