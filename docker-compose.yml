# Standalone docker-compose для ws-router.
# Использование: docker compose up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: ws_router_postgres
    environment:
      POSTGRES_DB: ws_router
      POSTGRES_USER: router
      POSTGRES_PASSWORD: router
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U router -d ws_router"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - backend

  ws-router:
    build: .
    container_name: ws_router
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://router:router@postgres:5432/ws_router
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8060:8060"
    volumes:
      - ${OPENCLAW_CONFIGS_PATH:-./configs}:/configs
    restart: unless-stopped
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
